name: Build

on:
  push:
  pull_request:

# oc3d-core and opa-core are build-time modules, not separately installed Fiji
# plugins or Maven-hosted dependencies. Keep these refs aligned with the
# versions pinned in pom.xml.
env:
  OC3D_CORE_REPO: Jay2owe/oc3d-core
  OC3D_CORE_REF: v0.1.0
  OPA_CORE_REPO: Jay2owe/opa-core
  OPA_CORE_REF: v0.4.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v7
        with:
          path: plugin

      - name: Check out oc3d-core
        uses: actions/checkout@v7
        with:
          repository: ${{ env.OC3D_CORE_REPO }}
          ref: ${{ env.OC3D_CORE_REF }}
          path: oc3d-core

      - name: Check out opa-core
        uses: actions/checkout@v7
        with:
          repository: ${{ env.OPA_CORE_REPO }}
          ref: ${{ env.OPA_CORE_REF }}
          path: opa-core

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and install oc3d-core
        run: mvn --batch-mode --no-transfer-progress -f oc3d-core/pom.xml clean install

      - name: Build and install opa-core
        run: mvn --batch-mode --no-transfer-progress -f opa-core/pom.xml clean install

      - name: Build and verify packaged JAR
        working-directory: plugin
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
